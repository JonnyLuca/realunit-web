name: Deploy develop to Cloudflare Pages

# Direct Upload of public/ to the DEV Pages project on push to develop. No build.

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: dev-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: wrangler pages deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        run: npm install -g wrangler@4

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        # wrangler looks for ./functions in the cwd (repo root), sibling to
        # public/. That middleware injects Smart App Banner app-argument.
        run: |
          wrangler pages deploy public \
            --project-name=realunit-web-dev \
            --branch=develop \
            --commit-hash=${{ github.sha }} \
            --commit-message="$COMMIT_MSG"
